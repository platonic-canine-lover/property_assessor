# Market snapshot, Cornwall, taken 16 October 2026. Every figure: value, basis, source, as_of.
# Granularity is stated honestly: nothing here is postcode-level.
long_let_rent_monthly:
  - { area: Cornwall, bedrooms: 1, granularity: local_authority, value: { value: "688",  basis: published, source: "https://www.ons.gov.uk/visualisations/housingpriceslocal/E06000052/", as_of: 2026-08-01, note: "ONS average private rent, Cornwall, August 2026" } }
  - { area: Cornwall, bedrooms: 2, granularity: local_authority, value: { value: "880",  basis: published, source: "https://www.ons.gov.uk/visualisations/housingpriceslocal/E06000052/", as_of: 2026-08-01, note: "ONS average private rent, Cornwall, August 2026" } }
  - { area: Cornwall, bedrooms: 3, granularity: local_authority, value: { value: "1077", basis: published, source: "https://www.ons.gov.uk/visualisations/housingpriceslocal/E06000052/", as_of: 2026-08-01, note: "ONS average private rent, Cornwall, August 2026; +2.1% on the year" } }
  - { area: Cornwall, bedrooms: 4, granularity: local_authority, value: { value: "1502", basis: published, source: "https://www.ons.gov.uk/visualisations/housingpriceslocal/E06000052/", as_of: 2026-08-01, note: "ONS average private rent, Cornwall, 4+ bed, August 2026" } }
short_let_adr_usd:
  - { area: Cornwall, granularity: county, value: { value: "242", basis: published, source: "https://www.airdna.co/vacation-rental-data/app/gb/south-west-england/cornwall/revenue", as_of: 2026-10-13, note: "AirDNA trailing 12 months Sep 2025 to Sep 2026, shown in USD; down 14.6% year on year; 18,386 active listings, down 32.9% year on year. No town or bedroom breakdown is public; postcode-level needs an AirDNA export (optional CSV import)." } }
short_let_occupancy:
  - { area: Cornwall, granularity: county, value: { value: "0.57", basis: published, source: "https://www.airdna.co/vacation-rental-data/app/gb/south-west-england/cornwall/revenue", as_of: 2026-10-13, note: "AirDNA annual occupancy, trailing 12 months; Cornwall is strongly seasonal (seasonality subscore 48), so this is a summer-heavy average, not a steady 57%." } }
sold_median:
  - { area: TR16, granularity: postcode_district, value: { value: "407766", basis: published, source: "https://www.rightmove.co.uk/house-prices/tr16.html", as_of: 2026-07-31, note: "Rightmove average sold price, detached, TR16, last year (Land Registry data to 31 Jul 2026, updated 17 Sep 2026). Overall TR16 average £326,074, up 3% on the year." } }
  - { area: PL27, granularity: postcode_district, value: { value: "292811", basis: published, source: "https://www.rightmove.co.uk/house-prices/pl27.html", as_of: 2026-07-31, note: "Rightmove average sold price, semi-detached, PL27, last year. Overall PL27 average £459,171 is inflated by Rock and Trebetherick (sales to £2.8m); St Eval is a former RAF estate and a different sub-market; down 7% on the year." } }
