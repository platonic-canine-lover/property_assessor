short_let_adr_usd:
  - { area: Cornwall, granularity: county, value: { value: "242", basis: published, source: "https://www.airdna.co/vacation-rental-data/app/gb/south-west-england/cornwall/revenue", as_of: 2026-10-13, note: "AirDNA trailing 12 months Sep 2025 to Sep 2026, shown in USD; down 14.6% year on year; 18,386 active listings, down 32.9% year on year. No town or bedroom breakdown is public; postcode-level needs an AirDNA export (optional CSV import)." } }
short_let_occupancy:
  - { area: Cornwall, granularity: county, value: { value: "0.57", basis: published, source: "https://www.airdna.co/vacation-rental-data/app/gb/south-west-england/cornwall/revenue", as_of: 2026-10-13, note: "AirDNA annual occupancy, trailing 12 months; Cornwall is strongly seasonal (seasonality subscore 48), so this is a summer-heavy average, not a steady 57%." } }
sold_median:
