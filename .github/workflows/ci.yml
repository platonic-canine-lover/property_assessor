name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/mypy
      - run: .venv/bin/pytest -q
      # The worked example must run from the committed snapshots with no network.
      - run: .venv/bin/python -m property_assessor.cli > /dev/null
