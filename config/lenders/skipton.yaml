    name: 2 Year Tracker, Base Rate + 0.69%
    kind: tracker
    tracker_margin: "0.0069"
    term_years: 2
    max_ltv: "0.75"
    rate:
      value: "0.0444"
      basis: stated
      source: my screenshot of the Skipton product finder, 16 Oct 2026
      as_of: 2026-10-16
      note: "Shown as 4.44% initial, APRC 6.20%, £995 fee, interest-only allowed. CONFIRM this is the buy-to-let variant: the finder card does not say so, and the £555/month example is the finder's default £150,000 loan."
    base_rate_assumed:
      value: "0.0375"
      basis: estimate
      source: 4.44% quoted rate minus 0.69% margin
      as_of: 2026-10-16
    fee:
      value: "995"
      basis: stated
      source: my screenshot of the Skipton product finder, 16 Oct 2026
      as_of: 2026-10-16
