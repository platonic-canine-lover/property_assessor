# Skipton Building Society, buy-to-let. Transcribed from the published
# criteria and product guide; every figure carries its source and date.
id: skipton
name: Skipton Building Society
criteria_url: https://www.skipton-intermediaries.co.uk/criteria/a-z-lending-criteria/a-z-lending-criteria-btl
criteria_as_of: 2026-10-16
accepted_uses: [long_let]        # "Holiday lets" and "Sub-letting" are listed as unacceptable; short_let is therefore excluded
accepts_limited_company: false   # "does not accept applications for limited company BTLs" nor SPVs
accepts_portfolio_landlord: true # with higher income and ICR requirements, below
max_ltv: "0.75"                  # "Maximum 75% LTV for all other BTL applications (subject to product maximum)"
new_build_incentive_max_ltv: "0.70"  # "Where a New Build has a financial incentive, the maximum LTV drops to 70%"
min_property_value:
  value: "75000"
  basis: published
  source: https://www.skipton-intermediaries.co.uk/criteria/a-z-lending-criteria/a-z-lending-criteria-btl
  as_of: 2026-10-16
min_earned_income:
  value: "20000"
  basis: published
  source: https://www.skipton.co.uk/mortgages/buy-to-let
  as_of: 2026-10-16
  note: "£45,000 for at least one applicant if a portfolio landlord"
icr:
  basic: "1.25"    # "Standard-rate taxpayers: 125%"
  higher: "1.45"   # "Higher-rate taxpayers and portfolio landlords: 145%"
icr_portfolio: "1.45"
stress:
  floor: "0.055"         # "the higher of; product rate plus 2% or 5.5%"
  uplift_short: "0.02"   # fixes under 5 years, and trackers
  uplift_long: "0.01"    # "5-year fix or longer: ... product rate plus 1%"
  long_fix_years: 5
products:
