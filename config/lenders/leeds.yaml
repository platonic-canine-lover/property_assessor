    fee: { value: "0", basis: published, source: "https://leedsbuildingsociety.co.uk/intermediaries/products/holiday-let-mortgages", as_of: 2026-09-21 }
notes:
  - "ICR 145% at max(rate + 2%, 5.5%) is an ASSUMPTION mirroring Cumberland's published holiday-let test (https://www.cumberland.co.uk/business/mortgages/holiday-let/lending-criteria); Leeds publishes its own in the 'Assessment of Rental Income' document, not on the product page. Confirm before relying on an eligibility result."
  - "Income basis: Leeds assesses on 'an average of low, medium and high season expected income' from a letting agent on its approved list (Mortgage Solutions, 5 Aug 2021). This tool feeds it the projected short-let gross income / 12; a real application needs the agent's letter."
  - "Cumberland BS is the alternative with fuller published criteria: min property £150,000, min income £25,000, rent taken net of 20% letting costs, 145% cover (125% for limited companies) at max(5.5%, rate + 2%); accepts limited company SPVs; LTV not shown on the criteria page."
